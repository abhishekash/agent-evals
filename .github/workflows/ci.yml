name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Run deterministic mechanism suite
        if: always()
        run: agent-evals run --provider scripted --out ci-results
      - name: Run safety regressions
        if: always()
        run: agent-evals run --tasks tasks/regressions --provider scripted --out ci-regressions
      - name: Upload eval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evals-${{ github.sha }}
          path: |
            ci-results/
            ci-regressions/
          if-no-files-found: warn
