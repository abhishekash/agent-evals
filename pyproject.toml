[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-evals"
version = "0.1.0"
description = "Eval-driven development for agents: task suites + deterministic scorers run through agent-harness, with traces as the debugging artifact."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Abhishek Ash", email = "ash.abhishek@gmail.com" }]
keywords = ["ai-agents", "evals", "llm-evaluation", "agent-harness", "human-in-the-loop", "benchmarking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "agent-harness @ git+https://github.com/abhishekash/agent-harness.git",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-evals = "agent_evals.cli:main"

[project.urls]
Homepage = "https://github.com/abhishekash/agent-evals"
Repository = "https://github.com/abhishekash/agent-evals"
Issues = "https://github.com/abhishekash/agent-evals/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
